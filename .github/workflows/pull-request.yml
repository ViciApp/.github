# The pull request rules every ViciApp repository shares. Each repository calls this from its own
# pr-checks.yml, and the org ruleset requires the resulting `pr-checks / pass` context, so a rule
# changes here once and applies everywhere.
name: Pull request

on:
  workflow_call:

permissions: {}

jobs:
  title:
    runs-on: ubuntu-24.04
    # The title comes from the event payload, not the API.
    permissions: {}
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "The PR title check only runs for pull_request events."

      - name: Validate Conventional Commit PR title (scope required)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The squash commit takes the PR title, and release-please reads those commits.
          pattern='^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK."
            exit 0
          fi

          # Keep the title off the start of a line so it can't inject a ::workflow:: command.
          echo "::error::PR title must be a Conventional Commit WITH A SCOPE: 'type(scope): description' (or 'type(scope)!: description' for a breaking change)."
          echo "::error::Scope = the affected area or package, or a short area such as 'deps' for tooling. E.g. 'feat(market): add filters'."
          echo "Got title: $PR_TITLE"
          exit 1

  not-empty:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fail on an empty change
        run: |
          # On a pull request HEAD is GitHub's test merge and HEAD^1 the base tip. In the merge
          # queue HEAD is this entry's commit and HEAD^1 whatever is queued ahead of it, so a PR
          # that an earlier entry already made redundant fails here instead of landing empty.
          if git diff --quiet HEAD^1 HEAD; then
            echo "::error::This pull request changes nothing against the branch it would land on."
            exit 1
          fi
          echo "Changed files: $(git diff --name-only HEAD^1 HEAD | wc -l)"

  release-fresh:
    # Only the queue can land a release PR that release-please has not rebuilt yet: once a PR ahead
    # of it merges, the queue may merge it before release-please reruns, and the merged commits then
    # never reach any changelog.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Hold a stale release PR out of the queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          pr="$(sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]{40}$#\1#p' <<<"$HEAD_REF")"
          if [[ -z "$pr" ]]; then
            echo "::error::Cannot read the PR number from the queue ref."
            echo "Queue ref: $HEAD_REF"
            exit 1
          fi

          head_branch="$(gh api "repos/$REPO/pulls/$pr" --jq .head.ref)"
          if [[ "$head_branch" != release-please--* ]]; then
            echo "PR #$pr is not a release PR."
            exit 0
          fi

          base_branch="${BASE_REF#refs/heads/}"
          base_tip="$(gh api "repos/$REPO/commits/$base_branch" --jq .sha)"
          ahead="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.parents[0].sha')"
          if [[ "$ahead" != "$base_tip" ]]; then
            echo "::error::Another pull request is queued ahead of this release PR. Queue it again on its own once release-please has rebuilt it."
            exit 1
          fi

          run="$(gh api "repos/$REPO/actions/workflows/release-please.yml/runs?branch=$base_branch&head_sha=$base_tip&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
          if [[ "$run" != "completed success" ]]; then
            echo "::error::release-please has not finished on the current $base_branch, so this release PR may be stale. Queue it again once it has run."
            echo "release-please on $base_tip: ${run:-no run}"
            exit 1
          fi
          echo "Release PR #$pr is current with $base_branch."

  pass:
    if: always()
    needs: ['title', 'not-empty', 'release-fresh']
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail when a check did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # release-fresh is skipped outside the merge queue, which counts as passing.
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A pull request check ended with: $result"
              exit 1
            fi
          done
          echo "All pull request checks passed."
